
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#09090b">
    <title>Gamevault</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <header class="site-header">
        <div class="header-container">
            <a href="#home" class="logo">Gamevault</a>

            <nav class="main-navigation" aria-label="Main navigation">
                <a href="#home" class="nav-link active">Discover</a>
                <a href="#games" class="nav-link">Games</a>
                <a href="#categories" class="nav-link">Categories</a>
            </nav>

            <button class="sign-in-button" id="sign-in-button" type="button">
                Sign in
            </button>
        </div>
    </header>

    <main id="home">
        <section class="hero-section">
            <div class="hero-content">
                <p class="eyebrow">YOUR NEXT ADVENTURE STARTS HERE</p>

                <h1>
                    Discover your next
                    <span class="hero-highlight">favourite game.</span>
                </h1>

                <p class="hero-description">
                    Explore new worlds, discover hidden gems,
                    and find your next gaming obsession.
                </p>

                <div class="hero-actions">
                    <a href="#games" class="primary-button">Explore games</a>
                    <a href="#categories" class="secondary-button">Browse categories</a>
                </div>
            </div>
        </section>

        <section class="games-section" id="games">
            <h2>Featured games</h2>
        </section>
    </main>
