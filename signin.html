
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08080c">
    <title>Sign In | GameSafe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
</head>

<body class="auth-page">

    <header class="auth-header">
        <a href="signin.html" class="brand">gamesafe<span>.</span></a>

        <p>PLAY SMART. PLAY SAFE.</p>
    </header>

    <main class="auth-main">

        <section class="auth-card">

            <div class="auth-heading">
                <span class="auth-label">WELCOME BACK</span>

                <h1>Enter your <span>world.</span></h1>

                <p>
                    Sign in to discover games, explore new worlds,
                    and play responsibly.
                </p>
            </div>

            <form class="auth-form" id="signin-form">

                <div class="form-group">
                    <label for="email">Email address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div class="auth-options">
                    <label class="remember-option">
                        <input type="checkbox" id="remember">
                        <span>Remember me</span>
                    </label>

                    <a href="#" id="forgot-password">
                        Forgot password?
                    </a>
                </div>

                <button type="submit" class="auth-submit">
                    Sign in <span aria-hidden="true">→</span>
                </button>

                <p id="auth-message" class="auth-message" role="status"></p>

            </form>

            <div class="auth-divider">
                <span>NEW TO GAMESAFE?</span>
            </div>

            <a href="signup.html" class="create-account">
                Create an account <span aria-hidden="true">→</span>
            </a>

            <p class="auth-footer">
                By continuing, you agree to use GameSafe responsibly.
            </p>

        </section>

        <p class="auth-bottom">
            YOUR NEXT ADVENTURE STARTS HERE.
        </p>

    </main>

    <script>
        const signinForm = document.getElementById("signin-form");
        const authMessage = document.getElementById("auth-message");

        signinForm.addEventListener("submit", function (event) {
            event.preventDefault();

            authMessage.textContent =
                "Sign-in is not connected yet. Authentication setup is needed.";

            authMessage.classList.add("is-visible");
        });

        document.getElementById("forgot-password").addEventListener(
            "click",
            function (event) {
                event.preventDefault();

                authMessage.textContent =
                    "Password recovery will be available after authentication is set up.";

                authMessage.classList.add("is-visible");
            }
        );
    </script>

</body>
</html>
