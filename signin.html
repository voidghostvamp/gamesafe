
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to GameSafe and explore your gaming world.">
    <title>Sign In | GameSafe</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header signin-header">
        <a href="index.html" class="logo">GameSafe</a>
        <a href="index.html" class="back-link">Back to Home</a>
    </header>

    <main class="signin-container">
        <section class="signin-card">

            <p class="eyebrow">WELCOME BACK</p>

            <h1>Enter Your World.</h1>
            <p class="signin-description">
                Sign in to continue exploring your gaming universe.
            </p>

            <form class="signin-form" id="signin-form">

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" class="signin-button">
                    Sign In
                </button>

            </form>

        </section>
    </main>

</body>
</html>
