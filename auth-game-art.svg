<svg xmlns="http://www.w3.org/2000/svg" width="620" height="820" viewBox="0 0 620 820" fill="none">
  <defs>
    <linearGradient id="bg" x1="36" y1="22" x2="604" y2="790" gradientUnits="userSpaceOnUse">
      <stop stop-color="#251447"/>
      <stop offset="0.5" stop-color="#17132D"/>
      <stop offset="1" stop-color="#101426"/>
    </linearGradient>
    <linearGradient id="shapeA" x1="79" y1="72" x2="440" y2="408" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9B7BFF"/>
      <stop offset="1" stop-color="#5B3BD1"/>
    </linearGradient>
    <linearGradient id="pad" x1="139" y1="376" x2="479" y2="566" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3EDFF"/>
      <stop offset="1" stop-color="#BDA7FF"/>
    </linearGradient>
    <linearGradient id="padEdge" x1="144" y1="389" x2="470" y2="587" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DCCEFF"/>
      <stop offset="1" stop-color="#8062E9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(335 433) rotate(90) scale(267 286)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9C7BFF" stop-opacity=".48"/>
      <stop offset="1" stop-color="#7750EC" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="92" y="335" width="432" height="310" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="620" height="820" fill="url(#bg)"/>
  <circle cx="471" cy="91" r="184" fill="#7B5AF2" fill-opacity=".15"/>
  <circle cx="95" cy="575" r="205" fill="#3E68FF" fill-opacity=".13"/>
  <path d="M420 -35L668 25L643 209L470 261L356 153L420 -35Z" fill="url(#shapeA)" fill-opacity=".26"/>
  <path d="M-42 690L122 504L284 625L215 842H-42V690Z" fill="#3D5DDF" fill-opacity=".25"/>
  <circle cx="322" cy="447" r="277" fill="url(#glow)"/>

  <text x="56" y="82" fill="#BFAAFF" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3.5">GAMESAFE COLLECTION</text>
  <text x="54" y="145" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="39" font-weight="800" letter-spacing="-1.5">Discover.</text>
  <text x="54" y="193" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="39" font-weight="800" letter-spacing="-1.5">Collect.</text>
  <text x="54" y="241" fill="#C5AEFF" font-family="Arial, sans-serif" font-size="39" font-weight="800" letter-spacing="-1.5">Level up.</text>
  <text x="56" y="275" fill="#C1BBD7" font-family="Arial, sans-serif" font-size="15">Find your next favourite game.</text>

  <!-- Floating game-category tiles -->
  <g transform="rotate(-8 116 357)">
    <rect x="45" y="315" width="128" height="72" rx="15" fill="#0D0B18" fill-opacity=".72" stroke="#A78BFA" stroke-opacity=".58"/>
    <rect x="58" y="328" width="30" height="30" rx="9" fill="#7D5CE7"/>
    <path d="M66 343L72 337L78 343L72 349L66 343Z" fill="white"/>
    <text x="97" y="340" fill="#F8F5FF" font-family="Arial, sans-serif" font-size="12" font-weight="700">RPG</text>
    <text x="97" y="357" fill="#AAA2C9" font-family="Arial, sans-serif" font-size="9">Explore worlds</text>
  </g>

  <g transform="rotate(7 500 333)">
    <rect x="418" y="292" width="148" height="76" rx="15" fill="#0D0B18" fill-opacity=".78" stroke="#7798FF" stroke-opacity=".7"/>
    <rect x="431" y="305" width="31" height="31" rx="9" fill="#3C5EEA"/>
    <path d="M447 311L441 323H447L444 330L453 318H447L450 311Z" fill="white"/>
    <text x="470" y="315" fill="#F8F5FF" font-family="Arial, sans-serif" font-size="12" font-weight="700">ACTION</text>
    <text x="470" y="334" fill="#AAA2C9" font-family="Arial, sans-serif" font-size="9">Play your way</text>
  </g>

  <!-- Controller glow and silhouette -->
  <path d="M154 425C165 397 188 386 220 397L263 412H356L399 397C431 386 454 397 465 425L492 500C503 529 482 550 455 541L395 516H224L164 541C137 550 116 529 127 500L154 425Z" fill="#9C76FF" fill-opacity=".48" filter="url(#shadow)"/>
  <path d="M156 422C167 395 190 386 220 397L263 411H356L399 397C429 386 452 395 463 422L489 496C499 524 480 543 454 535L394 511H225L165 535C139 543 120 524 130 496L156 422Z" fill="#111020" stroke="url(#padEdge)" stroke-width="4"/>
  <path d="M166 421C176 402 194 398 219 407L265 423H355L400 407C425 398 443 402 453 421L474 487C481 507 469 520 449 513L390 490H229L170 513C150 520 138 507 145 487L166 421Z" fill="url(#pad)"/>

  <path d="M190 452H232M211 431V473" stroke="#32235F" stroke-width="12" stroke-linecap="round"/>
  <circle cx="306" cy="454" r="23" fill="#7F5FE1" fill-opacity=".18" stroke="#9374E9" stroke-width="2"/>
  <circle cx="306" cy="454" r="10" fill="#6D4BD0"/>
  <circle cx="392" cy="438" r="10" fill="#7B55E3"/>
  <circle cx="417" cy="459" r="10" fill="#3E64E8"/>
  <circle cx="367" cy="459" r="10" fill="#CB76E8"/>
  <circle cx="392" cy="480" r="10" fill="#7B55E3"/>
  <circle cx="392" cy="438" r="3" fill="#F8F5FF"/>
  <circle cx="417" cy="459" r="3" fill="#F8F5FF"/>
  <circle cx="367" cy="459" r="3" fill="#F8F5FF"/>
  <circle cx="392" cy="480" r="3" fill="#F8F5FF"/>

  <!-- Neon accents and footer -->
  <circle cx="98" cy="455" r="5" fill="#BDA7FF"/>
  <circle cx="523" cy="414" r="4" fill="#7DA2FF"/>
  <path d="M78 611H542" stroke="#A78BFA" stroke-opacity=".3"/>
  <text x="56" y="648" fill="#BCA8F8" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.6">YOUR NEXT ADVENTURE STARTS HERE</text>
  <text x="56" y="679" fill="#A8A2C1" font-family="Arial, sans-serif" font-size="13">A collection built around what you love.</text>

  <g transform="translate(56 729)">
    <rect width="104" height="33" rx="9" fill="#A78BFA" fill-opacity=".12" stroke="#A78BFA" stroke-opacity=".35"/>
    <text x="52" y="21" text-anchor="middle" fill="#D7CBFF" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">DISCOVER</text>
    <rect x="117" width="98" height="33" rx="9" fill="#A78BFA" fill-opacity=".12" stroke="#A78BFA" stroke-opacity=".35"/>
    <text x="166" y="21" text-anchor="middle" fill="#D7CBFF" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">COLLECT</text>
    <rect x="228" width="83" height="33" rx="9" fill="#A78BFA" fill-opacity=".12" stroke="#A78BFA" stroke-opacity=".35"/>
    <text x="269.5" y="21" text-anchor="middle" fill="#D7CBFF" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">PLAY</text>
  </g>
